<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBC Weather Report – working concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111315; --card:#1E2022; --card2:#26292C; --line:#2C3034;
  --text:#F2F4F5; --muted:#A3AAB1; --dim:#6F777F;
  --blue:#1A9FE4; --green:#5BA215; --teal:#0E9E83;
  --yellow:#E9C100; --orange:#F69D14; --red:#D64040; --rain:#74C8ED; --chip:#1D2A33;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05080B;color:var(--text);font-family:"Nunito Sans",-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;gap:36px;min-height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[data-go],[data-act],[data-tog]{cursor:pointer}

/* ---------- presenter ---------- */
.panel{width:270px;display:flex;flex-direction:column;gap:10px;max-height:94vh}
.panel h1{font-size:20px;font-weight:800}
.panel .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.personas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0E1318;border:1px solid #1E262E;border-radius:10px;padding:4px}
.personas button{font-size:12px;padding:7px 2px;border-radius:7px;color:var(--muted);font-weight:700}
.personas button.on{background:var(--blue);color:#051018}
.plabel{font-size:13px;color:var(--muted);line-height:1.4;padding:2px 2px 0}
.plabel b{color:var(--text)}
.scenes{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.scene{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 11px;border-radius:10px;background:#12171C;border:1px solid #1E262E;font-size:14px}
.scene b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1E262E;font-size:11.5px;flex:none}
.scene.on{border-color:var(--blue);background:#0E2231}
.scene.on b{background:var(--blue);color:#051018}
.scene small{display:block;color:var(--muted);font-size:12px}
.navrow{display:flex;gap:6px}
.navrow button{flex:1;white-space:nowrap;padding:8px;border-radius:9px;background:#12171C;border:1px solid #1E262E;font-size:13px;color:var(--muted)}
.disclaimer{font-size:11px;color:var(--dim);line-height:1.4}

/* ---------- phone ---------- */
.stage{transform-origin:center center}
.phone{width:390px;height:844px;border-radius:54px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 10px #1a1d20,0 0 0 11px #2a2e33,0 30px 80px rgba(0,0,0,.6)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 6px 46px;font-weight:700;font-size:16px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--text)}
.search{flex:1;height:40px;border-radius:20px;background:#1A1C1E;border:1px solid #2A2D30;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:15px}
.kate{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--text);font-size:15px;margin-left:auto}
.klogo{width:16px;height:16px;border-radius:50%;background:#E6F6FF;display:inline-grid;place-items:center;flex:none}
.bell{position:relative;color:var(--blue)}
.bell.dot::after{content:"";position:absolute;top:1px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.chips{display:flex;gap:8px;padding:6px 16px 10px;overflow:hidden}
.chip{height:32px;border-radius:16px;background:var(--chip);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:14px;color:#C9D1D9;white-space:nowrap}
.chip.sel{background:#E9E9E9;color:#111}
.accts{display:flex;gap:10px;padding:6px 16px 0;overflow:hidden}
.acct{width:128px;flex:none;border-radius:10px;background:var(--card);overflow:hidden}
.acct .img{height:92px;position:relative;overflow:hidden}
.acct .img span{position:absolute;left:12px;bottom:12px;font-size:20px;font-weight:800;color:#fff}
.acct .nm{font-size:12.5px;color:var(--muted);padding:10px 10px 2px;text-transform:uppercase}
.acct .bal{font-size:15px;font-weight:700;padding:0 10px 12px}
.acct.sel{box-shadow:inset 0 -3px 0 var(--text)}
.acct.small{width:112px;display:flex;flex-direction:column;gap:8px;justify-content:center;padding:12px;font-size:14px;color:var(--muted)}
.tx{padding:12px 16px 4px}
.tx div{display:flex;gap:14px;font-size:15px;padding:5px 0}
.tx .d{color:var(--muted);width:40px;font-size:13px;padding-top:2px;flex:none}
.tx .a{margin-left:auto;font-weight:600;white-space:nowrap}
.tx .a.p{color:#7ED957}
.tx .hl{background:#1B2A36;border-radius:8px;margin:0 -8px;padding:5px 8px}
.link{color:var(--blue);font-weight:700;font-size:14px}
.sec{padding:22px 16px 0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sechead h2{font-size:18px;font-weight:400}
.card{background:var(--card);border-radius:10px;padding:16px;position:relative}
.card + .card{margin-top:12px}
.x{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:#2A3238;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.tip{display:flex;gap:14px}
.tip .ic{width:34px;flex:none;color:#C8CDD2;padding-top:2px}
.tip .t{font-size:15px;line-height:1.55}
.tiph{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;margin-bottom:4px}
.dot{position:absolute;left:-6px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.wx{background:linear-gradient(160deg,#1C2B38 0%,#1E2022 55%);border:1px solid #243644}
.wxtop{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px}
.tag{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--teal);color:#fff;border-radius:6px;padding:2px 7px}
.wxnow{display:flex;align-items:center;gap:14px;margin:12px 0 6px}
.temp{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.sub{font-size:13px;color:var(--muted);line-height:1.35}
.wxnow .lbl{margin-left:auto;text-align:right;font-size:14px;font-weight:700}
.wxnow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.wxhead{font-size:15px;line-height:1.45;margin:6px 0 12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;border-top:1px solid var(--line);padding-top:12px}
.week .dn{font-size:12px;color:var(--muted);margin-bottom:4px}
.week .dn.today{color:var(--text);font-weight:700}
.week .amt{font-size:11px;color:var(--muted);margin-top:2px;min-height:14px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 18px;border-radius:19px;border:1.5px solid var(--blue);color:var(--blue);font-size:16px;font-weight:600;white-space:nowrap}
.pill.fill{background:var(--blue);color:#06131C}
.pill.sm{height:34px;font-size:14.5px;padding:0 14px}
.pill.ghost{border-color:#3A3F44;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.inuit .row{display:flex;gap:30px;margin:14px 0}
.inuit .kpi{display:flex;gap:10px;align-items:center}
.inuit .sq{width:40px;height:40px;border-radius:9px;display:grid;place-items:center}
.inuit .kpi small{color:var(--muted);font-size:14px;display:block}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:100px;border-bottom:1px solid var(--line);padding:0 12px}
.bars .m{display:flex;gap:3px;align-items:flex-end}
.bars i{display:block;width:7px;border-radius:4px 4px 0 0}
.months{display:flex;justify-content:space-between;padding:8px 6px 0;font-size:13px;color:var(--muted)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#141618;border-top:1px solid #1C1F22;display:flex;justify-content:space-around;padding-top:8px;z-index:4}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#9AA0A6;width:70px}
.tab.on{color:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;z-index:6}
.fab{position:absolute;right:16px;bottom:100px;width:56px;height:56px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#06131C;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:5}
.subhead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;flex:none}
.subhead h3{font-size:17px;font-weight:600}
.subhead .iconbtn{color:var(--blue)}
.hero{padding:6px 16px 0}
.hero .big{display:flex;gap:16px;align-items:center}
.hero h2{font-size:21px;font-weight:800;line-height:1.28}
.hero p{color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:8px}
.temp2{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.temp2 b{font-size:34px;font-weight:800;letter-spacing:-1px}
.temp2 span{color:var(--muted);font-size:14px}
.delta{font-size:13px;font-weight:700;border-radius:6px;padding:2px 7px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border-radius:10px;background:var(--card);padding:10px 4px 8px;text-align:center;border:1.5px solid transparent}
.day.sel{border-color:var(--blue)}
.day .dn{font-size:12px;color:var(--muted)}
.day .dd{font-size:13px;font-weight:700;margin-bottom:6px}
.day .ev{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;white-space:nowrap}
.dayinfo{margin:10px 16px 0;background:var(--card);border-radius:10px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.dayinfo b{display:block;font-size:15px;margin-bottom:2px}
.dayinfo ul{margin-top:6px;padding-left:18px;color:var(--muted);font-size:13.5px}
.chart svg{display:block;width:100%}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .tx2{flex:1;font-size:15px;line-height:1.35}
.toggle .tx2 small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:#3A3F44;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}
.sw.on::after{left:23px}
.emoji{width:34px;height:34px;border-radius:9px;background:#2A2D30;display:grid;place-items:center;font-size:17px;flex:none}
.goal .bar{height:8px;border-radius:4px;background:#2E3337;margin:10px 0 8px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.fine{font-size:12.5px;color:var(--dim);padding:14px 16px 0;line-height:1.45}
.warnbox{margin:12px 16px 0;border-radius:10px;padding:12px 14px;background:#3A1718;border:1px solid #6B2626;font-size:14px;line-height:1.45}
.orange{background:linear-gradient(150deg,#4A2A08,#261708);border:1px solid #8A5510}
.orange .h{color:#FFC78A}
.lock{background:radial-gradient(120% 80% at 50% 0%,#20507A 0%,#0E2238 45%,#070D14 100%)}
.clock{text-align:center;margin-top:34px}
.clock .dte{font-size:19px;font-weight:600;color:#DDE7F0}
.clock .tm{font-size:92px;font-weight:300;line-height:1.05;letter-spacing:-2px}
.notif{margin:auto 12px 150px;border-radius:22px;background:rgba(40,52,64,.72);backdrop-filter:blur(20px);padding:14px 16px;display:flex;gap:12px;animation:slide .6s ease-out both .3s}
@keyframes slide{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.appic{width:38px;height:38px;border-radius:9px;background:linear-gradient(145deg,#1FA6EA,#0B6FB0);display:grid;place-items:center;flex:none}
.notif .h{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.notif .h span{font-weight:400;color:#C3CDD6;font-size:13px}
.notif .b{font-size:14.5px;line-height:1.4;margin-top:2px;color:#EEF3F7}
.lockhint{position:absolute;bottom:40px;width:100%;text-align:center;font-size:13px;color:#9FB3C6}
.chatwrap{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.chatwrap::-webkit-scrollbar{display:none}
.chatday{text-align:center;font-size:14px;margin-top:12px}
.chatai{text-align:center;color:var(--blue);font-size:14px;margin:4px 0 18px}
.msg{font-size:16px;line-height:1.55;margin:8px 0}
.kav{width:30px;height:30px;border-radius:50%;background:#E6F6FF;display:grid;place-items:center;margin:14px 0 6px}
.mini{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
.mini .mw{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:4px;margin-top:10px}
.mini .mw small{display:block;font-size:12px;color:var(--muted)}
.mini .mw em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.input{margin:0 16px 30px;height:50px;border-radius:25px;border:1px solid #3A3F44;display:flex;align-items:center;padding:0 5px 0 18px;color:var(--muted);font-size:16px;flex:none}
.input .mic{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#06131C}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.appear{animation:up .45s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.alertband{margin:4px 16px 0;border-radius:12px;background:linear-gradient(150deg,#5A1416,#2B0D0E);border:1px solid #8C2A2A;padding:16px}
.alertband .h,.orange .h{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#FFB4B0}
.alertband h2,.orange h2{font-size:20px;line-height:1.3;margin-top:10px;font-weight:800}
.alertband p,.orange p{font-size:14.5px;color:#F1D2D0;margin-top:6px;line-height:1.5}
.orange p{color:#F3DFC6}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:600}
.shield{display:flex;gap:10px;align-items:flex-start;background:#3A2A12;border:1px solid #7A5310;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;margin-top:10px}
.sig{display:flex;gap:10px;font-size:14.5px;line-height:1.45;padding:7px 0}
.sig i{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;margin-top:7px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.stack{display:flex;flex-direction:column;gap:10px;padding:16px}
.stack .pill{height:46px;font-size:16px}
.textbtn{color:var(--muted);font-size:14px;text-align:center;text-decoration:underline;padding:6px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.sheet .in{background:#1A1C1E;border-radius:20px 20px 0 0;padding:18px 18px 40px;width:100%;max-height:86%;overflow-y:auto;animation:up .3s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3F44;margin:0 auto 14px}
.sheet h4{font-size:18px;margin-bottom:8px}
.why{font-size:14px;color:var(--muted);line-height:1.5}
.why li{margin:4px 0 0 18px}
.lex{display:grid;grid-template-columns:34px 1fr;gap:10px 12px;align-items:start;font-size:14px;line-height:1.4}
.lex b{display:block}
.lex span{color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:#1F3A14;border:1px solid #3E7A1E;color:#D9F5C8;border-radius:10px;padding:12px 14px;font-size:14px;z-index:30;animation:up .3s ease-out}
.check{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.check:first-child{border-top:0}
.check .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.check small{display:block;color:var(--muted);font-size:13px}
.save{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.save:first-child{border-top:0}
.save .amt{margin-left:auto;text-align:right;font-weight:800;color:#8CD656;white-space:nowrap;font-size:15px}
.save .amt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.save .tx2{font-size:14.5px;line-height:1.45}
.save .tx2 b{display:block;font-size:15px}
.save .tx2 span{color:var(--muted)}
.save.done{opacity:.55}
.seg{display:flex;background:#1A1C1E;border:1px solid #2A2D30;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:13.5px;color:var(--muted);font-weight:600}
.seg button.on{background:#2E3A45;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--blue)}
.code{background:#0B0E11;border:1px solid #242A30;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;color:#C9D6E2;white-space:pre-wrap;word-break:break-word}
.code .m{color:#74C8ED}.code .ok{color:#8CD656}.code .no{color:#FF8A85}.code .k{color:#E9C100}
.zorg{margin:4px 16px 0;border-radius:12px;padding:16px;background:linear-gradient(160deg,#243040,#1B2129);border:1px solid #33475C}
.zorg h2{font-size:20px;font-weight:800;margin-top:8px}
.zorg p{color:#C6D3DF;font-size:14.5px;line-height:1.5;margin-top:6px}

/* ---------- motor ---------- */
.motor{display:none;width:min(1060px,calc(100vw - 360px));max-height:94vh;overflow-y:auto;background:#0B0F13;border:1px solid #1E262E;border-radius:18px;padding:26px 28px}
.motor h2{font-size:24px;font-weight:800}
.motor .lead{color:var(--muted);font-size:14.5px;margin-top:6px;line-height:1.5;max-width:720px}
.mctl{display:flex;gap:12px;align-items:center;margin:18px 0}
.mctl .seg{width:340px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi2{background:#12181E;border:1px solid #1E262E;border-radius:12px;padding:14px 16px}
.kpi2 small{color:var(--muted);font-size:12.5px;display:block}
.kpi2 b{font-size:26px;font-weight:800;display:block;margin-top:4px;letter-spacing:-.5px}
.kpi2 span{font-size:12.5px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}
.pipe div{background:#12181E;border:1px solid #1E262E;border-radius:10px;padding:10px 12px;position:relative;font-size:13px}
.pipe div b{display:block;font-size:17px;margin-top:4px}
.pipe div small{color:var(--muted);font-size:11.5px}
.pipe div.acc{border-color:var(--blue);background:#0E2231}
.pipe div:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px}
.mgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.mbox{background:#12181E;border:1px solid #1E262E;border-radius:12px;padding:16px}
.mbox h3{font-size:15px;margin-bottom:12px}
.hb{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hb .track{height:10px;background:#1C242C;border-radius:5px;overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:5px;transition:width .3s}
.hb em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.feed{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.7;color:#B8C4CF}
.feed div{display:flex;gap:10px;white-space:nowrap;overflow:hidden;border-bottom:1px solid #182028;padding:3px 0}
.feed .id{color:var(--dim);width:64px;flex:none}
.prog{height:6px;background:#1C242C;border-radius:3px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--blue)}

@media (max-width:820px){
  body{flex-direction:column;gap:14px;overflow:auto;padding:16px 0;justify-content:flex-start}
  .panel{width:calc(100% - 32px);order:2;max-height:none}
  .motor{width:calc(100% - 24px)}
  .kpis{grid-template-columns:1fr 1fr}.pipe{grid-template-columns:1fr 1fr 1fr}.mgrid{grid-template-columns:1fr}
}

/* ================= Lotte model ================= */
const START=Date.UTC(2026,9,2), NDAYS=29, DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const lbl=(i,base,unit)=>{const d=new Date((base||START)+i*864e5*(unit||1));return {dn:DN[d.getUTCDay()],dd:d.getUTCDate()+'/'+(d.getUTCMonth()+1)}};
const FIX={3:[['Phone plan',25]],4:[['Gift for Sara (birthday)',35]],5:[['Energy bill',85]],6:[['Spotify',12]],13:[['Tenant insurance',48]],18:[['Gym',30]]};
function lotte(st){
  const ev=[...Array(NDAYS)].map((_,i)=>(FIX[i]||[]).map(([n,a])=>({n,a,k:'vast'})));
  if(st.uitgaan) ev[0].push({n:'Night out',a:60,k:'impuls'});
  if(st.gsm) ev[8].push({n:'New phone',a:299,k:'groot'});
  if(st.sparen) [7,14,21].forEach(i=>ev[i].push({n:'To Lisbon',a:25,k:'sparen'}));
  const planned=ev.flat().reduce((s,e)=>s+e.a,0), vrij=(1120-planned-100)/NDAYS;
  let b=1120; const path=[b]; for(let i=0;i<NDAYS;i++){b-=20+ev[i].reduce((s,e)=>s+e.a,0);path.push(b)}
  const low=Math.min(...path), w=[];
  for(let i=0;i<NDAYS;i++){const e=ev[i],sp=e.filter(x=>x.k!=='sparen').reduce((s,x)=>s+x.a,0);let t;
    if(e.some(x=>x.k==='groot'))t=low<0?'storm':'regen';else if(e.some(x=>x.k==='impuls'))t='donder';else if(sp>=30)t='regen';
    else if(i>0&&w[i-1]==='donder')t='bewolkt';else if(i>1&&w[i-2]==='donder')t='regenboog';else if(vrij<18)t='bewolkt';else t='zon';w.push(t)}
  return {ev,vrij,path,low,w,red:path.findIndex((v,i)=>i>0&&v<0)};
}
const spend=e=>e.filter(x=>x.k!=='sparen').reduce((s,x)=>s+x.a,0);

function lineChart(path,opt){
  opt=opt||{};const W=330,H=150,p=12,mx=opt.max??Math.max(...path,...(opt.hi||[]))*1.08,mn=opt.min??Math.min(0,...path,...(opt.lo||[]))-60;
  const n=path.length-1,X=i=>p+i*(W-2*p)/n,Y=v=>p+(mx-v)*(H-2*p)/(mx-mn);
  const pts=a=>a.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const neg=(opt.lo?Math.min(...opt.lo):Math.min(...path))<0, col=opt.col||(neg&&!opt.lo?'#D64040':'#1A9FE4');
  let s=`<defs><linearGradient id="g${opt.id||''}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4A5057" stroke-dasharray="3 4"/><text x="${p}" y="${Y(0)+13}" font-size="10" fill="#A3AAB1">€0</text>`;
  if(opt.lo){ s+=`<path d="M${pts(opt.hi).join('L')}L${pts(opt.lo).reverse().join('L')}Z" fill="#AEB9C4" opacity=".18"/>`;
    s+=`<polyline points="${pts(opt.lo).join(' ')}" fill="none" stroke="${Math.min(...opt.lo)<0?'#F69D14':'#8A96A3'}" stroke-width="1.6" stroke-dasharray="4 3"/><polyline points="${pts(opt.hi).join(' ')}" fill="none" stroke="#8A96A3" stroke-width="1.6" stroke-dasharray="4 3"/>`;}
  else s+=`<path d="M${pts(path).join('L')}L${X(n)},${Y(mn)}L${X(0)},${Y(mn)}Z" fill="url(#g${opt.id||''})"/>`;
  s+=`<polyline points="${pts(path).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
  s+=`<circle cx="${X(n)}" cy="${Y(path[n])}" r="4" fill="${col}"/><text x="${X(n)-6}" y="${Y(path[n])-9}" text-anchor="end" font-size="11" font-weight="700" fill="#F2F4F5">${eur(path[n])}</text>`;
  if(opt.lo){s+=`<text x="${X(n)-6}" y="${Y(opt.lo[n])+14}" text-anchor="end" font-size="10.5" fill="${Math.min(...opt.lo)<0?'#FFA663':'#A3AAB1'}">worst case ${eur(opt.lo[n])}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

let timers=[];
function chatSeq(parts){
  timers.forEach(clearTimeout);timers=[];const el=document.getElementById('chat');if(!el)return;el.innerHTML='';let t=150;
  parts.forEach((p,i)=>{
    if(i>=2){timers.push(setTimeout(()=>el.insertAdjacentHTML('beforeend','<div class="msg typing" id="typ"><span></span><span></span><span></span></div>'),t));t+=700}

  });
}

function klimDyn(){const k=ST.klimaat,yrs=42,n=yrs*12,r=k.r/12;

 const W=330,H=170,p=14,mx=Math.max(tot,1000)*1.12,X=a=>p+(a-23)*(W-2*p)/42,Y=v=>H-26-(v/mx)*(H-40);
 const pts=path.map((v,i)=>`${X(23+i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 const svg=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="kg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5BA215" stop-opacity=".4"/><stop offset="1" stop-color="#5BA215" stop-opacity="0"/></linearGradient></defs><path d="M${X(23)},${Y(0)}L${pts.replace(/ /g,'L')}L${X(65)},${Y(0)}Z" fill="url(#kg)"/><polyline points="${pts}" fill="none" stroke="#8CD656" stroke-width="2.4"/><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3A3F44"/>${seasons.map(([a,n2],i)=>`<g><line x1="${X(a)}" x2="${X(a)}" y1="${Y(0)}" y2="${Y(0)+5}" stroke="#6F777F"/><text x="${X(a)}" y="${H-6-(i%2)*0}" font-size="9.5" fill="#A3AAB1" text-anchor="${i===0?'start':i===seasons.length-1?'end':'middle'}">${a}</text></g>`).join('')}<circle cx="${X(65)}" cy="${Y(tot)}" r="4.5" fill="#8CD656"/><text x="${X(65)-8}" y="${Y(tot)-8}" text-anchor="end" font-size="12" font-weight="800" fill="#F2F4F5">${eur(tot)}</text></svg>`;
 return `<div class="sec"><div class="card chart" style="padding:14px 12px 10px">${svg}<div class="legend"><span>23 · now</span><span>65 · retirement</span></div></div>

function motorHTML(){return `<h2>The engine behind the weather report</h2>

<div class="mgrid"><div class="mbox"><h3>Detected moments</h3><div id="mbars"></div></div><div class="mbox"><h3>From the stream</h3><div class="feed" id="mfeed"><div style="color:#6F777F">Start the simulation.</div></div></div></div>
<p class="fine" style="padding:14px 0 0">Synthetic customers with a fixed seed. Rules are simplified for the demo; in production this runs as a streaming job alongside existing fraud detection.</p>`}
const MOM=[['rood','Code red · fraud','#D64040'],['zorg','Care mode · bereavement','#7394C2'],['oranje','Code orange · hardship','#F69D14'],['storm','Storm forecast','#EE7079'],['kot','Season · child leaves home','#E9C100'],['baby','Season · young family','#F6B1BD'],['verhuis','Season · moving house','#74C8ED'],['mist','Fog · uncertain income','#AEB9C4'],['donder','Thunder after a night out','#9FC95F']];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let mRunning=false;
function runMotor(N){
  if(mRunning)return;mRunning=true;const r=mulberry(2300000);const c={};MOM.forEach(m=>c[m[0]]=0);let sent=0,det=0,tx=0,done=0;const feed=[];const t0=performance.now();let busy=0;
  const step=()=>{const s=performance.now(),end=Math.min(N,done+25000);
    for(let i=done;i<end;i++){
      const age=18+(r()*72|0),free=r()<.08,n=40+(r()*60|0);tx+=n;
      const f={rood:r()<.0006,zorg:age>55&&r()<.002,oranje:(free&&r()<.12)||r()<.004,storm:r()<.03,kot:age>=42&&age<=58&&r()<.05,baby:age>=25&&age<=40&&r()<.025,verhuis:r()<.012,mist:free,donder:age<40&&r()<.1};
      let first=null;for(const [k] of MOM){if(f[k]){c[k]++;det++;if(!first)first=k}}
      let send=false; if(first){ if(first==='donder') send=r()<.45; else if(first==='mist') send=false; else send=true; }
      if(send)sent++;
      if(first&&feed.length<400&&r()<.02){const conf=(70+r()*28|0);feed.push([i,age,first,conf,send])}
    }
    busy+=performance.now()-s;done=end;
    const ms=busy, per=ms/done;
    document.getElementById('k1').textContent=done.toLocaleString('en-GB');
    document.getElementById('k1s').textContent=Math.round(tx/1e6*10)/10+' M transactions';
    document.getElementById('k2').textContent=ms<1000?Math.round(ms)+' ms':(ms/1000).toFixed(1)+' s';
    document.getElementById('k2s').textContent=(per*1000).toFixed(1)+' µs per customer';
    const full=per*2.3e6/1000;document.getElementById('k3').textContent=full<60?full.toFixed(1)+' s':(full/60).toFixed(1)+' min';
    document.getElementById('k4').textContent=Math.round((1-sent/done)*100)+'%';
    document.getElementById('mprog').style.width=(done/N*100)+'%';
    const f=x=>x.toLocaleString('en-GB');
    document.getElementById('p1').textContent=f(tx);document.getElementById('p2').textContent=f(det);document.getElementById('p3').textContent=f(done);document.getElementById('p4').textContent=f(det);document.getElementById('p5').textContent=f(sent);document.getElementById('p6').textContent=f(sent);
    const mx=Math.max(...Object.values(c),1);
    document.getElementById('mbars').innerHTML=MOM.map(([k,n,col])=>`<div class="hb"><span>${n}</span><div class="track"><i style="width:${c[k]/mx*100}%;background:${col}"></i></div><em>${f(c[k])}</em></div>`).join('');
    const nm=Object.fromEntries(MOM.map(m=>[m[0],m[1]]));
    document.getElementById('mfeed').innerHTML=feed.slice(-12).reverse().map(([id,age,k,conf,s])=>`<div><span class="id">#${String(id).padStart(6,'0')}</span><span>${age} y · ${nm[k]} (${conf}%)</span><span style="margin-left:auto;color:${s?'#1A9FE4':'#6F777F'}">${s?'→ Kate':'silent'}</span></div>`).join('');
    if(done<N)requestAnimationFrame(step);else mRunning=false;};
  requestAnimationFrame(step);
}

  const pk=s.p;
  document.getElementById('personas').innerHTML=Object.entries(P).map(([k,v])=>`<button class="${k===pk?'on':''}" data-persona="${k}">${v.name}</button>`).join('');
  document.getElementById('plabel').innerHTML=P[pk].desc;
  document.getElementById('scenes').innerHTML=SC.map((x,i)=>x.p!==pk?'':`<button class="scene ${i===cur?'on':''}" data-idx="${i}"><b>${i+1}</b><span>${x.t}<small>${x.s}</small></span></button>`).join('');
}
function go(id){const i=typeof id==='number'?id:SC.findIndex(x=>x.id===id);if(i<0)return;cur=(i+SC.length)%SC.length;sheet=null;if(!go.keepToast)toast=null;go.keepToast=false;draw(false);if(SC[cur].id==='l-chat')playChat()}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-sheetbg]')&&!t.closest('.in')){sheet=null;draw(true);return}
  const nav=t.closest('[data-nav]');if(nav){const v=nav.dataset.nav;if(v==='r'){ST=init();go(0)}else go(cur+ +v);return}
  const per=t.closest('[data-persona]');if(per){go(SC.findIndex(x=>x.p===per.dataset.persona));return}
  const idx=t.closest('[data-idx]');if(idx){go(+idx.dataset.idx);return}
  const tg=t.closest('[data-tog]');if(tg){const [a,b]=tg.dataset.tog.split('.');ST[a][b]=!ST[a][b];if(a==='lotte'&&b==='gsm')ST.lotte.sel=ST.lotte.gsm?8:0;draw(true);return}
  const sh=t.closest('[data-sheet]');if(sh){sheet=sh.dataset.sheet;draw(true);return}
  const ac=t.closest('[data-act]');if(ac){ACT[ac.dataset.act](ac.dataset.v);if(ac.dataset.act!=='yasFix')draw(true);return}
  const g=t.closest('[data-go]');if(g&&!t.closest('#motor')){go(g.dataset.go);return}
});
document.addEventListener('input',e=>{const r=e.target.closest('[data-range]');if(r){const [a,b]=r.dataset.range.split('.');ST[a][b]=+r.value;document.getElementById('kamt').textContent=eur(ST.klimaat.m);document.getElementById('kdyn').innerHTML=klimDyn()}});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1)}if(e.key==='ArrowLeft')go(cur-1);if(e.key==='r'||e.key==='R'){ST=init();go(0)}});
function fit(){const st=document.getElementById('stage');const sc=Math.min(1,(innerHeight-40)/864,(innerWidth-24)/410);st.style.transform=`scale(${sc})`;if(innerWidth<=820){st.style.height=(864*sc)+'px';st.style.transformOrigin='top center'}}
addEventListener('resize',fit);fit();
if('speechSynthesis' in window)speechSynthesis.getVoices();
go(0);
</script>
</body>
</html>
